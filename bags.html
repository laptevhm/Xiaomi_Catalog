<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рюкзаки, сумки та елементи одягу - MobiTrade</title><link rel="icon" href="images/logo.png"><style>body{margin:0;padding:28px 20px 50px;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:1280px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:28px}.back{color:#1d1d1f;text-decoration:none}.brand{font-weight:700;font-size:14px}h1{font-size:32px;margin:0 0 30px}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.item{background:#fff;border:1px solid #e5e5e7;border-radius:20px;padding:14px}.img-box{height:220px;background:#fafafa;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:15px}.img-box img{width:100%;height:100%;padding:14px;object-fit:contain}.n{font-size:15px;font-weight:600;line-height:1.3;min-height:39px}.desc{color:#86868b;font-size:13px;line-height:1.35;margin-top:7px;min-height:35px}.c{color:#86868b;font-size:11px;display:block;margin-top:10px}.p{font-size:21px;font-weight:700;margin-top:12px}@media(max-width:600px){body{padding:20px 12px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:9px}.img-box{height:160px}.n{font-size:13px}.p{font-size:18px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← Назад</a><div class="brand">MobiTrade Xiaomi Acs</div></div><h1>Рюкзаки, сумки та елементи одягу</h1><div class="product-grid" id="list"></div></div><script>const products=[
  {
    "id": "6934177711664",
    "name": "Рюкзак Mi business multi-functional shoulder bag 2 Black",

  },
  {
    "id": "6934177715846",

  {
    "id": "6934177748110",
    "name": "Сумка на пояс Xiaomi Sports Fanny Pack Black (AN) (941946)",

  },
  {
    "id": "6972281349779",
    "name": "Xiaomi Qimian DuPont/Silvadur antibacterial men's socks Grey Black 3 pcs pack",

  },
  {
    "id": "810648012002",
    "name": "Рукавички Moshi Digits touch screen L (99MO065031)",
    "description": "",
    "price": 1325
  }
];const list=document.getElementById("list"),f=new Intl.NumberFormat("uk-UA");products.forEach(i=>{const c=document.createElement("article");c.className="item";c.innerHTML=`<div class="img-box"><img src="images/${i.id}.webp" id="img-${i.id}" alt="${i.name}"></div><div class="n">${i.name}</div><div class="desc">${i.description||""}</div><span class="c">Арт: ${i.id}</span><div class="p">${f.format(i.price)} грн</div>`;list.appendChild(c);const im=document.getElementById(`img-${i.id}`);im.onerror=function(){if(this.src.endsWith(".webp"))this.src=`images/${i.id}.jpg`;else{this.src="https://img.icons8.com/ios/100/86868b/electronics.png";this.onerror=null}}});</script></body></html>
