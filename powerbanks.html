<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зовнішні акумулятори - MobiTrade</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<style>
:root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#86868b; --line:#e5e5e7; --accent:#ff6a00; }
* { box-sizing:border-box; }
body { margin:0; padding:28px 20px 50px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
.wrap { max-width:1280px; margin:0 auto; }
.top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
.back { color:var(--text); text-decoration:none; font-size:15px; font-weight:500; }
.brand { font-size:14px; font-weight:700; letter-spacing:.02em; }
h1 { margin:0 0 30px; font-size:32px; line-height:1.1; letter-spacing:-.03em; font-weight:650; }
.product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(245px,1fr)); gap:18px; }
.item { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; text-align:left; overflow:hidden; transition:transform .18s ease,box-shadow .18s ease; }
.item:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.07); }
.img-box { height:220px; border-radius:14px; background:#fafafa; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:15px; }
.img-box img { width:100%; height:100%; padding:14px; object-fit:contain; }
.info { padding:0 4px 3px; }
.n { font-size:15px; font-weight:600; line-height:1.3; min-height:39px; }
.desc { color:var(--muted); font-size:13px; line-height:1.35; margin-top:7px; min-height:35px; }
.c { color:var(--muted); font-size:11px; margin-top:10px; display:block; }
.p { font-size:21px; font-weight:700; margin-top:12px; letter-spacing:-.02em; }
@media (max-width:600px) {
 body { padding:20px 12px 40px; }
 h1 { font-size:27px; margin-bottom:22px; }
 .product-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
 .item { padding:9px; border-radius:16px; }
 .img-box { height:160px; border-radius:11px; }
 .n { font-size:13px; min-height:34px; }
 .desc { font-size:12px; min-height:32px; }
 .p { font-size:18px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html" class="back">← Назад</a>
    <div class="brand">MobiTrade Xiaomi Acs</div>
  </div>
  <h1>Зовнішні акумулятори</h1>
  <div class="product-grid" id="list"></div>
</div>
<script>
const products = [
          {
                    "id": "6934177704826",
                    "name": "Power Bank Xiaomi 3 74W 20000mAh Black",
                    "price": 3615,
                    "description": ""
          },
          {
                    "id": "6941812758663",
                    "name": "Power Bank Xiaomi 10000mAh 22.5W Slim (BHR9350GL) Light Gray",
                    "price": 1115,
                    "description": ""
          },
          {
                    "id": "6941812780299",
                    "name": "Power Bank Xiaomi 5000mAh Ultra Slim 18W (BHR9535GL) Сірий",
                    "price": 885,
                    "description": ""
          },
          {
                    "id": "6941812792155",
                    "name": "Power Bank Xiaomi 20000mAh 33W Compact (BHR8851GL) Beige",
                    "price": 1580,
                    "description": ""
          },
          {
                    "id": "6941812795651",
                    "name": "Power Bank Xiaomi 20000mAh 33W Compact (BHR8975GL) Blue",
                    "price": 1580,
                    "description": ""
          },
          {
                    "id": "6941812797495",
                    "name": "Power Bank Xiaomi 6000mAh 15W Magnetic (BHR9074GL) Beige",
                    "price": 1860,
                    "description": ""
          },
          {
                    "id": "6941812797501",
                    "name": "Power Bank Xiaomi 10000mAh 22.5W Compact (BHR9073GL) Blue",
                    "price": 1300,
                    "description": ""
          },
          {
                    "id": "6941812797518",
                    "name": "Power Bank Xiaomi 10000mAh 22.5W Compact (BHR9073GL) Beige",
                    "price": 1300,
                    "description": ""
          },
          {
                    "id": "6941812798447",
                    "name": "Power Bank Xiaomi 30000mAh 18W (BHR9126GL) Чорний",
                    "price": 2325,
                    "description": ""
          }
];

const list = document.getElementById("list");
const formatter = new Intl.NumberFormat("uk-UA");

products.forEach(item => {
  const card = document.createElement("article");
  card.className = "item";
  card.innerHTML = `
    <div class="img-box">
      <img src="images/${item.id}.webp" id="img-${item.id}" alt="${item.name}">
    </div>
    <div class="info">
      <div class="n">${item.name}</div>
      <div class="desc">${item.description || ""}</div>
      <span class="c">Арт: ${item.id}</span>
      <div class="p">${formatter.format(item.price)} грн</div>
    </div>
  `;
  list.appendChild(card);
  const img = document.getElementById(`img-${item.id}`);
  img.onerror = function() {
    if (this.src.endsWith(".webp")) this.src = `images/${item.id}.jpg`;
    else { this.src = "https://img.icons8.com/ios/100/86868b/electronics.png"; this.onerror = null; }
  };
});
</script>
</body>
</html>
