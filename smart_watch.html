<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Смарт-годинники - MobiTrade</title><link rel="icon" href="images/logo.png"><style>:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e5e5e7}*{box-sizing:border-box}body{margin:0;padding:28px 20px 50px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:1280px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:28px}.back{color:var(--text);text-decoration:none;font-size:15px}.brand{font-size:14px;font-weight:700}h1{margin:0 0 30px;font-size:32px;letter-spacing:-.03em}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}.img-box{height:220px;border-radius:14px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:15px}.img-box img{width:100%;height:100%;padding:14px;object-fit:contain}.n{font-size:15px;font-weight:600;line-height:1.3;min-height:39px}.desc{color:var(--muted);font-size:13px;line-height:1.35;margin-top:7px;min-height:35px}.c{color:var(--muted);font-size:11px;margin-top:10px;display:block}.p{font-size:21px;font-weight:700;margin-top:12px}@media(max-width:600px){body{padding:20px 12px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:9px}.img-box{height:160px}.n{font-size:13px}.p{font-size:18px}}</style></head><body><div class="wrap"><div class="top"><a href="index.html" class="back">← Назад</a><div class="brand">MobiTrade Xiaomi Acs</div></div><h1>Смарт-годинники</h1><div class="product-grid" id="list"></div></div><script>const products=[];const list=document.getElementById("list"),formatter=new Intl.NumberFormat("uk-UA");products.forEach(item=>{const card=document.createElement("article");card.className="item";card.innerHTML=`<div class="img-box"><img src="images/${item.id}.webp" id="img-${item.id}" alt="${item.name}"></div><div class="n">${item.name}</div><div class="desc">${item.description||""}</div><span class="c">Арт: ${item.id}</span><div class="p">${formatter.format(item.price)} грн</div>`;list.appendChild(card);const img=document.getElementById(`img-${item.id}`);img.onerror=function(){if(this.src.endsWith(".webp"))this.src=`images/${item.id}.jpg`;else{this.src="https://img.icons8.com/ios/100/86868b/electronics.png";this.onerror=null}}});</script></body></html>
